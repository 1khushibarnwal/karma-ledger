<!doctype html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KarmaLedger — On-chain developer reputation</title>
  <meta name="description"
    content="KarmaLedger scores a developer's public GitHub activity and mints it as a soulbound badge — a reputation that travels with the wallet, not the platform." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
    rel="stylesheet" />
  <script>
    // Applied before first paint so the page never flashes the wrong theme.
    (function () {
      try {
        var saved = localStorage.getItem("karmaledger-theme");
        var prefersLight = window.matchMedia("(prefers-color-scheme: light)").matches;
        var theme = saved || (prefersLight ? "light" : "dark");
        document.documentElement.classList.toggle("dark", theme === "dark");
      } catch (e) {
        /* private mode / storage disabled — dark stays as the default */
      }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
